<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>과일 짝맞추기 게임</title>
    <link rel="stylesheet" href="index.css">
    <meta name="description" content="시니어를 위한 인지 향상 과일 짝맞추기 퍼즐 게임">
</head>
<body>
    <div class="container">
        <header>
            <h1 id="game-title">과일 짝맞추기 🍎</h1>
            <div class="game-selector">
                <button id="fruit-mode-btn" class="selector-btn active">🍎 과일 맞추기</button>
                <button id="flower-mode-btn" class="selector-btn">🌸 꽃 맞추기</button>
            </div>
            <div class="stats">
                시도 횟수: <span id="moves">0</span>
            </div>
        </header>

        <main class="game-board" id="game-board">
            <!-- Cards will be generated here by JavaScript -->
        </main>

        <footer>
            <button id="restart-btn" class="btn">새 게임 시작</button>
        </footer>
    </div>

    <!-- Success Modal -->
    <div id="success-modal" class="modal hidden">
        <div class="modal-content">
            <h2>축하합니다! 🎉</h2>
            <p id="success-message">모든 과일의 짝을 찾으셨어요.</p>
            <p>총 시도 횟수: <span id="final-moves"></span>번</p>
            <button id="modal-restart-btn" class="btn primary-btn">한 번 더 하기</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
